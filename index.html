<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="titlebar">
        <h1>Retro OS</h1>
    </header>
    <main id="desktop">
        <div class="desktop-icons">
            <button class="icon" data-app="notepad">
                <span class="icon-box">📝</span>
                <span class="icon-label">Notepad</span>
            </button>
            <button class="icon" data-app="paint">
                <span class="icon-box">🎨</span>
                <span class="icon-label">Paint</span>
            </button>
            <button class="icon" data-app="calc">
                <span class="icon-box">🧮</span>
                <span class="icon-label">Calculator</span>
            </button>
            <button class="icon" data-app="terminal">
                <span class="icon-box">💻</span>
                <span class="icon-label">Terminal</span>
            </button>
            <button class="icon" data-app="settings">
                <span class="icon-box">⚙️</span>
                <span class="icon-label">Settings</span>
            </button>
        </div>

        <section class="window" id="window-notepad">
            <header class="window-header">
                <span class="window-title">Notepad</span>
                <div class="window-controls">
                    <button class="btn-close" data-close="window-notepad">X</button>
                </div>
            </header>
            <div class="window-body">
                <textarea id="notepad-text" placeholder="Write something here..."></textarea>
                <div id="notepad-status">0 character(s) | 0 word(s)</div>
            </div>
        </section>

        <section class="window" id="window-terminal">
            <header class="window-header">
                <span class="window-title">Terminal</span>
                <div class="window-controls">
                    <button class="btn-close" data-close="window-terminal">X</button>
                </div>
            </header>
            <div class="window-body">
                <div id="terminal-output">
                    <p>Retro OS v1.0 - Type 'help' for commands.</p>
                </div>
                <input type="text" id="terminal-input" placeholder="Enter command..." autocomplete="off" />
            </div>
        </section>

        <section class="window" id="window-paint">
            <header class="window-header">
                <span class="window-title">Paint</span>
                <div class="window-controls">
                    <button class="btn-close" data-close="window-paint">X</button>
                </div>
            </header>
            <div class="window-body">
                <canvas id="paint-canvas" width="340" height="200"></canvas>
                <div class="paint-tools">
                    <input type="color" id="paint-color" value="#000000"/>
                    <input type="range" id="paint-size" min="1" max="20" value="3" />
                    <button id="paint-clear">Clear</button>
                    <button id="paint-save">Save</button>
                </div>
            </div>
        </section>
        
        <section class="window" id="window-calc">
            <header class="window-header">
                <span class="window-title">Calculator</span>
                <div class="window-controls">
                    <button class="btn-close" data-close="window-calc">X</button>
                </div>
            </header>
            <div class="window-body">
                <div id="calc">
                    <input type="text" id="calc-display" disabled />
                    <div class="calc-grid">
                        <button class="calc-btn" data-value="7">7</button>
                        <button class="calc-btn" data-value="8">8</button>
                        <button class="calc-btn" data-value="9">9</button>
                        <button class="calc-btn" data-value="/">/</button>
                        <button class="calc-btn" data-value="4">4</button>
                        <button class="calc-btn" data-value="5">5</button>
                        <button class="calc-btn" data-value="6">6</button>
                        <button class="calc-btn" data-value="*">*</button>
                        <button class="calc-btn" data-value="1">1</button>
                        <button class="calc-btn" data-value="2">2</button>
                        <button class="calc-btn" data-value="3">3</button>
                        <button class="calc-btn" data-value="-">-</button>
                        <button class="calc-btn" data-value="0">0</button>
                        <button class="calc-btn" data-value=".">.</button>
                        <button class="calc-btn" data-value="+">+</button>
                        <button class="calc-btn" data-value="=">=</button>
                        <button class="calc-btn" data-value="C" style="grid-column: span 4;">C</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="window" id="window-settings">
            <header class="window-header">
                <span class="window-title">Settings</span>
                <div class="window-controls">
                    <button class="btn-close" data-close="window-settings">X</button>
                </div>
            </header>
            <div class="window-body">
                <label>Desktop Color:</label>
                <input type="color" id="bg-picker" value="#008080" />
                <br><br>
                <label>Username:</label>
                <input type="text"  id="username-input" placeholder="user" />
                <br><br>
                <button id="save-settings">Save</button>
            </div>
        </section>
    </main>
    
<div id="start-menu">
    <div class="start-header">Retro OS v1.0</div>
    <button class="start-item" data-app="notepad">📝 Notepad</button>
    <button class="start-item" data-app="paint">🎨 Paint</button>
    <button class="start-item" data-app="calc">🧮 Calculator</button>
    <button class="start-item" data-app="settings">⚙️ Settings</button>
    <button class="start-item" data-app="terminal">💻 Terminal</button>
</div>
    <footer id="taskbar">
        <button id="start-btn">Start</button>
        <div id="clock">12.00 AM</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
